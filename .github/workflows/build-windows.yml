name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --windowed --name AgentFreeWindows main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AgentFreeWindows-windows-x64
          path: dist/AgentFreeWindows/
